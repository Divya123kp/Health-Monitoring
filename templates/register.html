{% extends "base.html" %}
{% block title %}{{ _('t_register') }}{% endblock %}
{% block content %}
<main class="auth">
  <section class="auth-art">
    <svg class="ecg-bg" viewBox="0 0 800 200" fill="none"><path d="M0 100 H140 L170 100 L190 40 L215 170 L240 100 H330 L350 80 L370 100 H500 L520 30 L545 180 L570 100 H800" stroke="url(#rg)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="animation:draw 3.2s linear infinite;stroke-dasharray:1400"/><defs><linearGradient id="rg" x1="0" x2="1"><stop stop-color="#ff5c7a"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs></svg>
    <h2>{{ _('reg_art_h')|safe }}</h2>
    <p>{{ _('reg_art_p')|safe }}</p>
  </section>
  <section class="auth-form">
    <form class="auth-card" method="post" autocomplete="on">
      <h1>{{ _('reg_h1') }}</h1>
      <p class="sub">{{ _('reg_sub') }}</p>
      {% if error %}<div class="err">{{ error }}</div>{% endif %}
      <div class="field"><label for="full_name">{{ _('lbl_fullname') }}</label>
        <input class="input" id="full_name" name="full_name" required value="{{ form.get('full_name','') }}" autocomplete="name"></div>
      <div class="form-grid">
        <div class="field"><label for="username">{{ _('lbl_username') }}</label>
          <input class="input" id="username" name="username" required value="{{ form.get('username','') }}" autocomplete="username"></div>
        <div class="field"><label for="email">{{ _('lbl_email') }}</label>
          <input class="input" id="email" name="email" type="email" required value="{{ form.get('email','') }}" autocomplete="email"></div>
      </div>
      <div class="form-grid">
        <div class="field"><label for="password">{{ _('lbl_password') }}</label>
          <input class="input" id="password" name="password" type="password" minlength="6" required autocomplete="new-password"></div>
        <div class="field"><label for="confirm">{{ _('lbl_confirm') }}</label>
          <input class="input" id="confirm" name="confirm" type="password" minlength="6" required autocomplete="new-password"></div>
      </div>
      <button class="btn btn-primary" type="submit">{{ _('btn_register') }}</button>
      <p class="auth-alt">{{ _('already_reg') }} <a href="{{ url_for('login') }}">{{ _('log_in_link') }}</a></p>
    </form>
  </section>
</main>
{% endblock %}
